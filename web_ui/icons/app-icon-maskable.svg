<!-- Raster source for icon-maskable-512.png (manifest purpose "maskable").

     Same art as app-icon.svg, but the flame is 45% of the canvas instead of
     60%. Android crops a maskable icon to an arbitrary shape and only
     guarantees the centre 80% circle survives; at 60% the flame's tips clip on
     a circular mask. The wider margin is why this is a separate file rather
     than another size of the same one.

     Flame path from Lucide (ISC) — see web_ui/ATTRIBUTIONS.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bisque-flame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6900"/>
      <stop offset="1" stop-color="#e7000b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bisque-flame)"/>
  <g transform="translate(140.8 140.8) scale(9.6)"
     fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/>
  </g>
</svg>
