<!-- Raster source for apple-touch-icon.png / icon-192.png / icon-512.png.
     Not under public/, so it is never shipped — scripts/gen-web-icons.sh
     rasterizes it into web_ui/public/.

     The app's header logo (App.tsx) at icon scale: the same orange-500 →
     red-600 gradient, the same white Lucide flame, and the same 60% glyph-to-
     tile proportion as the 24px-in-40px header tile.

     Full-bleed, no rounding of our own: iOS composites a transparent
     apple-touch-icon onto black and applies its own superellipse mask, so the
     gradient has to run to the edges and the flame has to stay clear of the
     ~10% the corners lose.

     Flame path from Lucide (ISC) — see web_ui/ATTRIBUTIONS.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bisque-flame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6900"/>
      <stop offset="1" stop-color="#e7000b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bisque-flame)"/>
  <g transform="translate(102.4 102.4) scale(12.8)"
     fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/>
  </g>
</svg>
