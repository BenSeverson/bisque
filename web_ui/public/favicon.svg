<!-- Bisque browser-tab mark: the same gradient tile and flame the app draws in
     its own header (App.tsx), so the tab icon and the page under it agree.

     Retuned for 16px, where fidelity to the 40px header stops mattering and
     legibility starts: the flame is 72% of the tile rather than 60%, and its
     stroke is 2.6 rather than 2 — at the header's proportions it renders about
     0.8px on a 16px favicon and disappears.

     Flame path from Lucide (ISC) — see web_ui/ATTRIBUTIONS.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bisque-flame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6900"/>
      <stop offset="1" stop-color="#e7000b"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bisque-flame)"/>
  <g transform="translate(6.72 6.72) scale(1.44)"
     fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/>
  </g>
</svg>
