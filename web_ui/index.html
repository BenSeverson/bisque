<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bisque</title>

    <!-- SVG first for browsers that take it, 32px PNG for Safari < 16.4. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      Both values match the resolved `--background` in styles/theme.css, so the
      browser chrome (and, on iOS 15+, the standalone status bar) blends into
      the app instead of framing it. The media queries cover the pre-JS paint
      and the no-JS case; once React mounts, `applyTheme` overwrites the content
      of both to follow an explicit light/dark preference, which a media query
      cannot see.
    -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />

    <!-- Home-screen launch. `mobile-web-app-capable` is the standard spelling;
         iOS reads only the `apple-` one, so both have to be here. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bisque" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
