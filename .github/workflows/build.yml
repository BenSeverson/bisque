name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR runs to keep CI minutes bounded. Pushes to `main`
# are not cancelled so each merge produces a complete artifact run.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token for all jobs; artifact upload uses the actions API and
# needs no extra scopes.
permissions:
  contents: read

jobs:
  lint-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web_ui/package-lock.json
      - run: npm ci
        working-directory: web_ui
      - run: npm run typecheck
        working-directory: web_ui
      - run: npm run lint
        working-directory: web_ui
      - run: npm run format:check
        working-directory: web_ui
      # Generate JSON fixtures from the C-side API builders so the cross-
      # language contract test in web_ui/test/contracts/ has something to
      # validate. Without this, the contract suite skips with a notice.
      - name: Build host API fixtures
        run: make fixtures
      - run: npm run test:run
        working-directory: web_ui

  lint-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check C formatting
        run: make lint-c

  unit-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Host unit tests
        run: make test-host

  ui-screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Resolve LVGL version
        id: lvgl
        run: |
          LVGL_VERSION=$(awk '/^  lvgl\/lvgl:/{f=1; next} f && /version:/{print $2; exit}' dependencies.lock)
          echo "version=${LVGL_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Cache LVGL clone
        id: lvgl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: managed_components/lvgl__lvgl
          key: lvgl-v${{ steps.lvgl.outputs.version }}
      - name: Fetch LVGL
        if: steps.lvgl-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p managed_components
          git clone --depth 1 --branch v${{ steps.lvgl.outputs.version }} \
            https://github.com/lvgl/lvgl.git managed_components/lvgl__lvgl
      - name: Configure
        run: cmake -S simulator -B simulator/build
      - name: Build simulator
        run: cmake --build simulator/build
      # Runs before the pixel diff on purpose: it asserts on dashboard state rather
      # than on rendered pixels, so it is immune to the capture flakiness tracked in
      # #196 and a genuine state regression is reported on its own rather than buried
      # in a wall of screenshot failures.
      - name: Verify dashboard state
        run: ./simulator/build/bisque_sim --verify
      - name: Prepare actual-render dir
        run: mkdir -p docs/screenshots/actual
      - name: Diff against baselines
        run: ./simulator/build/bisque_sim --diff
      - name: Upload renders on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-screenshots-actual
          path: docs/screenshots/actual/lcd-*.png

  # iOS companion-app build. Intentionally NOT in `build.needs:` — iOS
  # regressions don't block firmware merges. Keep that policy explicit;
  # if iOS becomes a release-blocking platform, add `build-ios` to the
  # `needs:` list on the `build` job below.
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compute version
        run: |
          echo "BISQUE_VERSION=$(./scripts/version.sh)" >> $GITHUB_ENV
          echo "BISQUE_MARKETING_VERSION=1.0.0" >> $GITHUB_ENV
          echo "BISQUE_BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
        working-directory: ios/Bisque
      - name: Build iOS app
        run: xcodebuild -scheme Bisque -sdk iphoneos -arch arm64 CODE_SIGNING_ALLOWED=NO -quiet
        working-directory: ios/Bisque

  # Gate only on the cheap smoke checks (~13s combined) so the long
  # firmware build starts almost immediately. lint-web and ui-screenshots
  # still run in parallel and still gate the overall workflow result;
  # they just no longer delay this job's start.
  #
  # This job runs entirely inside the espressif/idf:v6.0.2 image — the
  # same image espressif/esp-idf-ci-action uses internally. The build is
  # deliberately NOT CodeQL-traced: a traced build cannot use ccache (a
  # cache hit skips the compiler, so CodeQL would see nothing compile),
  # and the analyze step alone adds ~3.5 min to every PR. CodeQL's c-cpp
  # analysis instead lives in codeql.yml (push to main + weekly), which
  # does its own cold traced build — same policy as its Swift job.
  build:
    needs: [lint-c, unit-host]
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The checkout is owned by the host runner user while the container
      # runs as root, so git refuses to read the repo ("dubious
      # ownership"). Without this, `git describe` in version.sh fails and
      # both BISQUE_VERSION and the CMake-derived PROJECT_VER silently
      # become 0.0.0-unknown.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Compute version
        run: echo "BISQUE_VERSION=$(./scripts/version.sh)" >> $GITHUB_ENV

      # Build web UI (idf.py build bundles the gzipped assets into the
      # SPIFFS image, so this must precede the firmware build).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web_ui/package-lock.json
      - run: npm ci
        working-directory: web_ui
      - run: npm run build
        working-directory: web_ui
      - name: Gzip web assets
        run: make gzip
      - name: Check SPIFFS size
        run: make size-spiffs

      # Persist the compiler cache across runs so unchanged translation
      # units are not recompiled. restore-keys takes the most recent prior
      # cache when there is no exact SHA hit. PR-branch saves are only
      # visible to that branch, so the caches PRs actually warm-start from
      # are the ones saved by pushes to main.
      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: esp-idf-ccache-${{ github.sha }}
          restore-keys: |
            esp-idf-ccache-
      - name: Create ccache dir
        run: mkdir -p .ccache

      # GitHub bypasses the image entrypoint for container jobs, so we
      # source export.sh explicitly to put idf.py and the xtensa toolchain
      # on PATH.
      #
      # CCACHE_MAXSIZE must comfortably exceed one full build's output:
      # at the old 500M limit the cache sat at 100% with constant
      # cleanups, and LRU eviction ahead of the (deterministic) compile
      # order produced a 0% hit rate across the cache's entire history.
      # Stats are zeroed before the build so --show-stats reports this
      # run's hit rate rather than a lifetime aggregate.
      - name: Build firmware
        run: |
          export IDF_CCACHE_ENABLE=1
          export CCACHE_DIR="$PWD/.ccache"
          export CCACHE_MAXSIZE=2G
          . "$IDF_PATH/export.sh"
          ccache --zero-stats
          idf.py set-target esp32s3
          idf.py build
          ccache --show-stats

      - name: Check firmware size
        run: make size-firmware

      # clang-tidy reuses the toolchain in the image, but esp-clang itself
      # is not bundled — idf_tools.py downloads it on every run (~30s).
      # Cache the installed tool; on a hit the install step just verifies
      # and skips the download. The key tracks the container image tag
      # since that pins which esp-clang version tools.json resolves —
      # bump it together with the image.
      - name: Cache esp-clang
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/esp/tools/esp-clang
          key: esp-clang-idf-v6.0.2

      # `idf.py clang-check` always exits 0 (it only generates a report), so
      # it cannot gate on its own — a real lint regression would pass
      # silently. We capture its output and fail the job if any genuine
      # clang-tidy finding is present.
      #
      # clang-diagnostic-* lines are filtered out: esp-clang is fed the
      # xtensa-gcc compile DB, so it chokes on gcc-15 driver flags it doesn't
      # recognise and on newlib headers it can't locate. That noise can't be
      # cleanly removed in this container and is not project lint. Real
      # findings carry a `file:line:col:` prefix and a `[check-name]` tag
      # (e.g. `[readability-braces-around-statements]`); the toolchain errors
      # either lack the location prefix or are tagged `[clang-diagnostic-*]`,
      # so this filter keeps the former and drops the latter. Limitation:
      # checks that need full semantic analysis (clang-analyzer-*) are
      # unreliable while the parse is broken, but the AST/syntactic checks
      # the project enables (readability-*, misc-redundant-expression, …)
      # fire correctly and are gated here.
      - name: Run clang-tidy
        run: |
          . "$IDF_PATH/export.sh"
          idf_tools.py install esp-clang
          eval "$(idf_tools.py export)"
          idf.py clang-check --run-clang-tidy-options="-warnings-as-errors=*" \
            --exclude-paths managed_components 2>&1 | tee clang-tidy.log
          if grep -E ':[0-9]+:[0-9]+: (warning|error): ' clang-tidy.log \
               | grep -v 'clang-diagnostic-'; then
            echo "::error::clang-tidy reported lint violations (see the lines above)"
            exit 1
          fi
          echo "clang-tidy: no project lint findings"

      # cppcheck does not need the IDF toolchain. We're already root in
      # the container; no sudo (it's not installed in the image).
      - name: Run cppcheck
        run: |
          apt-get update && apt-get install -y cppcheck
          make cppcheck

      # Upload binary
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bisque-firmware-${{ env.BISQUE_VERSION }}
          path: |
            build/bisque.bin
            build/storage.bin
